type: "ConstNode"
title: "Const Node"
inputs: []
outputs:
  - name: "Value"
    dtype: "float"
attributes:
  - name: "value"
    type: "float"
    default: 2.0
constraints:
  max_input_links: 0
  max_output_links: 99
  allow_self_loop: false
  allow_cycles: false
compute: |
  # Emit attribute value
  OUT['Value'] = float(ATTR.get('value', 0.0))
