type: "Sum"
title: "Sum"
inputs:
  - name: "A"
    dtype: "float"
  - name: "B"
    dtype: "float"
outputs:
  - name: "Out"
    dtype: "float"
attributes:
  - name: "result"
    type: "float"
    default: 0.0
constraints:
  max_input_links: 3
  max_output_links: 1
  allow_self_loop: false
  allow_cycles: false
compute: |
  a = float(IN.get('A', 0.0)) if IN.get('A') is not None else 0.0
  b = float(IN.get('B', 0.0)) if IN.get('B') is not None else 0.0
  s = a + b
  ATTR['result'] = s
  OUT['Out'] = s
